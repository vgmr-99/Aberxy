<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 660" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="380" height="660" fill="#eef2f1"/>
  <!-- phone frame -->
  <rect x="40" y="30" width="300" height="600" rx="40" fill="#0f172a"/>
  <rect x="52" y="42" width="276" height="576" rx="30" fill="#f6faf8"/>
  <!-- notch -->
  <rect x="150" y="30" width="80" height="16" rx="8" fill="#0f172a"/>
  <!-- status bar -->
  <text x="70" y="70" font-size="12" fill="#0f172a" font-weight="700">9:41</text>
  <text x="270" y="70" font-size="12" fill="#0f172a" font-weight="700">📶 🔋</text>
  <!-- header -->
  <text x="70" y="110" font-size="22" font-weight="800" fill="#0f172a">设置</text>
  <rect x="70" y="128" width="240" height="2" fill="#e2e8f0"/>
  <!-- config address card (highlighted) -->
  <rect x="70" y="150" width="240" height="120" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="86" y="178" font-size="14" font-weight="700" fill="#059669">配置地址</text>
  <text x="86" y="200" font-size="9.5" fill="#475569" style="word-break:break-all">https://cdn.jsdelivr.net/gh/</text>
  <text x="86" y="214" font-size="9.5" fill="#475569" style="word-break:break-all">ouyushan/tvbox-cfg@main/</text>
  <text x="86" y="228" font-size="9.5" fill="#475569" style="word-break:break-all">config/multi.json</text>
  <rect x="86" y="240" width="60" height="20" rx="6" fill="#10b981"/>
  <text x="116" y="254" font-size="11" fill="#fff" text-anchor="middle">粘贴</text>
  <!-- other rows -->
  <g fill="#fff" stroke="#e2e8f0">
    <rect x="70" y="286" width="240" height="44" rx="12"/>
    <rect x="70" y="340" width="240" height="44" rx="12"/>
    <rect x="70" y="394" width="240" height="44" rx="12"/>
  </g>
  <text x="86" y="313" font-size="13" fill="#0f172a">直播配置</text>
  <text x="86" y="367" font-size="13" fill="#0f172a">播放设置</text>
  <text x="86" y="421" font-size="13" fill="#0f172a">关于</text>
  <!-- save button -->
  <rect x="70" y="470" width="240" height="48" rx="14" fill="#059669"/>
  <text x="190" y="500" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">保存并加载</text>
  <text x="190" y="560" font-size="11" fill="#94a3b8" text-anchor="middle">示意图：将任一配置地址粘贴到「配置地址」</text>
  <text x="190" y="578" font-size="11" fill="#94a3b8" text-anchor="middle">后保存即可一键加载全部源</text>
</svg>
